name: CI Pipeline

on:
  pull_request:
    branches:
      - devel
      - stage
      - prod


jobs:

  check-branch-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Block invalid PRs
        run: |
          case "${{ github.event.pull_request.base.ref }}" in
            stage) [[ "${{ github.event.pull_request.head.ref }}" == "devel" ]] || exit 1 ;;
            prod) [[ "${{ github.event.pull_request.head.ref }}" == "stage" ]] || exit 1 ;;
          esac

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase/rdicidr-0.1.0 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js 15
        uses: actions/setup-node@v4
        with:
            node-version: '15'

      - name: install npm 7
        run: install -g npm@7

      - name: install dependencies
        run: npm install

      - name: linter
        run: npm run lint
      
      - name: prettier
        run: npm run prettier -- --write

      - name: test
        run: CI=true npm run test

      - name: build app
        run: npm run build